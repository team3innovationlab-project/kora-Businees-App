version: '3.8'

services:
  wing-ai-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wing-ai-pos
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/vps-info"]
      interval: 30s
      timeout: 10s
      retries: 3
